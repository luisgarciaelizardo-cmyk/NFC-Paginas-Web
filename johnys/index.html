<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Johny's Burgers &amp; BBQ</title>
<meta name="description" content="Johny's Burgers &amp; Barbecue: pide por WhatsApp, síguenos en Instagram y Facebook, y mira el menú completo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-deep:#070707;
    --surface:#1a1a1a;
    --red:#e2151f;
    --red-deep:#9c0d14;
    --cream:#f5ece0;
    --text:#f2ece4;
    --text-soft:#a89c8f;
    --line:#2c2c2c;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    justify-content:center;
    padding:0 0 40px;
  }

  .page{
    width:100%;
    max-width:460px;
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--red-deep) 0%, var(--red) 100%);
  }

  .header{
    text-align:center;
    padding:28px 24px 8px;
  }

  .logo-badge{
    display:inline-block;
    background:#ffffff;
    border-radius:26px;
    padding:14px 18px;
    box-shadow:0 12px 26px -8px rgba(0,0,0,0.6);
  }

  .logo-badge img{
    display:block;
    width:150px;
    max-width:52vw;
    height:auto;
    margin:0 auto;
  }

  .tagline{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--text-soft);
    margin-top:14px;
  }

  .quick-links{
    padding:16px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .qlink{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.5);
  }

  .qlink:active{ transform:scale(0.97); }

  .qlink .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .qlink .icon svg{ width:19px; height:19px; fill:#fff; }

  .qlink.whatsapp{ background:linear-gradient(135deg,#2fbf71,#1a9c58); }
  .qlink.facebook{ background:linear-gradient(135deg,#1f78c9,#12466e); }
  .qlink.instagram{ background:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7); }

  .menu-section{
    padding:8px 20px 0;
  }

  .menu-title{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:26px;
    text-align:center;
    color:var(--red);
    margin:12px 0 4px;
    text-transform:uppercase;
  }

  .menu-subtitle{
    text-align:center;
    font-size:12.5px;
    color:var(--text-soft);
    margin-bottom:16px;
  }

  .menu-image-wrap{
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 16px 34px -14px rgba(0,0,0,0.6);
    display:block;
  }

  .menu-image-wrap img{
    display:block;
    width:100%;
    height:auto;
  }

  .menu-hint{
    text-align:center;
    font-size:11.5px;
    color:var(--text-soft);
    margin-top:10px;
  }

  .footer-note{
    text-align:center;
    padding:24px 24px 6px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
<body>

  <div class="menu-section">
    <p class="menu-title">Menú</p>
    <p class="menu-subtitle">Toca la imagen para verla en tamaño completo</p>

    <a href="../assets/johnys-menu.jpg" target="_blank" rel="noopener" class="menu-image-wrap">
      <img src="../assets/johnys-menu.jpg" alt="Menú de Johny's Burgers & Barbecue">
    </a>
    <p class="menu-hint">Precios en pesos mexicanos</p>
  </div>

</div>

</body>
</html>
