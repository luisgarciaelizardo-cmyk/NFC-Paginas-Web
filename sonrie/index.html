<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sonríe</title>
<meta name="description" content="Contacto de Sonríe Especialidades Dentales: ubicación, WhatsApp, Facebook, Instagram y reseñas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf6fd;
    --bg-deep:#d5edfa;
    --surface:#ffffff;
    --navy-deep:#003d8f;
    --navy:#0048a8;
    --blue:#0d90e4;
    --blue-light:#5cc2f5;
    --gold:#f5a623;
    --gold-deep:#e08e0b;
    --text:#0a2e57;
    --text-soft:#5b7ba0;
    --shadow: 4, 40, 90;
    --brand-navy-deep:#003d8f;
    --brand-navy:#0048a8;
    --brand-blue:#0d90e4;
    --brand-blue-light:#5cc2f5;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#061726;
      --bg-deep:#020b14;
      --surface:#0e243d;
      --navy-deep:#bcdcfa;
      --navy:#8fc4f5;
      --blue:#5cc2f5;
      --blue-light:#3d7fae;
      --text:#eaf6fd;
      --text-soft:#93b3d4;
      --shadow: 0, 0, 0;
    }
  }

  :root[data-theme="dark"]{
    --bg:#061726;
    --bg-deep:#020b14;
    --surface:#0e243d;
    --navy-deep:#bcdcfa;
    --navy:#8fc4f5;
    --blue:#5cc2f5;
    --blue-light:#3d7fae;
    --text:#eaf6fd;
    --text-soft:#93b3d4;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:30px;
    box-shadow:0 24px 50px -12px rgba(var(--shadow),0.28);
    overflow:hidden;
    text-align:center;
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--navy) 0%, var(--blue-light) 100%);
  }

  .header{
    padding:30px 24px 6px;
  }

  .logo-badge{
    display:inline-block;
    background:#ffffff;
    border-radius:22px;
    padding:16px 20px;
    box-shadow:0 10px 24px -6px rgba(var(--shadow),0.22);
  }

  .logo-badge img{
    display:block;
    width:190px;
    max-width:58vw;
    height:auto;
  }

  .business{ padding:20px 24px 4px; }

  .business-name{
    font-family:'Fredoka', sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--navy-deep);
    margin:0;
  }

  .business-role{
    font-size:13.5px;
    color:var(--text-soft);
    margin-top:6px;
  }

  .links{
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.35);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.24);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.location{ background:linear-gradient(135deg,var(--brand-navy),var(--brand-blue)); }
  .link-btn.whatsapp{ background:linear-gradient(135deg,#2fbf71,#1a9c58); }
  .link-btn.facebook{ background:linear-gradient(135deg,#1f78c9,var(--brand-navy-deep)); }
  .link-btn.instagram{ background:linear-gradient(135deg,var(--brand-navy-deep),var(--brand-blue-light)); }
  .link-btn.reviews{ background:linear-gradient(135deg,var(--gold),var(--gold-deep)); }

  .footer-note{
    padding:0 24px 22px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
<body>

  </div>

  <div class="footer-note">Sonríe Especialidades Dentales &middot; Saltillo, Coahuila</div>

</div>

</body>
</html>
