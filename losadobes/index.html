<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Los Adobes</title>
<meta name="description" content="Los Adobes: llama, síguenos en Instagram y Facebook, mira la ubicación y el menú completo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf0e2;
    --bg-deep:#f3ddbe;
    --surface:#ffffff;
    --brown:#3b2418;
    --brown-deep:#241408;
    --orange:#e8600a;
    --orange-deep:#b8480a;
    --text:#2c1c12;
    --text-soft:#8a7867;
    --line:#efe1cc;
    --shadow: 40, 24, 10;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    justify-content:center;
    padding:0 0 40px;
  }

  .page{
    width:100%;
    max-width:460px;
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--brown) 0%, var(--orange) 100%);
  }

  .header{
    text-align:center;
    padding:28px 24px 8px;
  }

  .logo-badge{
    display:inline-block;
    background:#ffffff;
    border-radius:24px;
    padding:12px 18px;
    box-shadow:0 12px 26px -8px rgba(var(--shadow),0.35);
  }

  .logo-badge img{
    display:block;
    width:180px;
    max-width:56vw;
    height:auto;
  }

  .tagline{
    font-size:13px;
    font-weight:600;
    color:var(--text-soft);
    margin-top:14px;
  }

  .quick-links{
    padding:16px 20px 20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
  }

  .qlink{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 14px;
    border-radius:16px;
    text-decoration:none;
    font-weight:700;
    font-size:13.5px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 16px -6px rgba(var(--shadow),0.4);
  }

  .qlink:active{ transform:scale(0.97); }

  .qlink .icon{
    width:34px;
    height:34px;
    flex:0 0 34px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .qlink .icon svg{ width:17px; height:17px; fill:#fff; }

  .qlink.call{ background:linear-gradient(135deg,var(--orange),var(--orange-deep)); }
  .qlink.location{ background:linear-gradient(135deg,#2f9e63,#1c7a48); }
  .qlink.facebook{ background:linear-gradient(135deg,#1f78c9,#12466e); }
  .qlink.instagram{ background:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7); }

  .menu-section{
    padding:8px 0 0;
  }

  .menu-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:26px;
    text-align:center;
    color:var(--brown);
    margin:12px 20px 4px;
  }

  .menu-subtitle{
    text-align:center;
    font-size:12.5px;
    color:var(--text-soft);
    margin:0 20px 14px;
  }

  .menu-carousel{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    gap:14px;
    padding:4px 20px 12px;
    -webkit-overflow-scrolling:touch;
  }

  .menu-carousel::-webkit-scrollbar{ height:6px; }
  .menu-carousel::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .menu-page{
    flex:0 0 82%;
    scroll-snap-align:center;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 14px 30px -14px rgba(var(--shadow),0.4);
    background:var(--surface);
  }

  .menu-page img{
    display:block;
    width:100%;
    height:auto;
  }

  .menu-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    padding:2px 20px 4px;
  }

  .menu-dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--line);
  }

  .footer-note{
    text-align:center;
    padding:24px 24px 6px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
<body>

      </span>

  <div class="menu-section">

</body>
</html>
