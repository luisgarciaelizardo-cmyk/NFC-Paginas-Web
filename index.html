<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Aqua Medik | Dra. Brenda Vallejo</title>
<style>
  :root{
    --navy:#0e5f8f;
    --navy-dark:#0a4a70;
    --teal:#17b3ad;
    --teal-light:#3fd0c9;
    --bg:#f2fbfc;
    --text:#0b3a52;
    --text-soft:#4c7488;
    --card:#ffffff;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:28px;
    box-shadow:0 20px 45px rgba(14,95,143,0.15);
    overflow:hidden;
    text-align:center;
  }

  .header{
    background:linear-gradient(160deg, var(--navy) 0%, var(--teal) 100%);
    padding:36px 24px 30px;
  }

  .logo-wrap{
    width:120px;
    height:120px;
    margin:0 auto 12px;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
  }

  .logo-wrap svg{
    width:78px;
    height:78px;
  }

  .brand{
    color:#fff;
    font-size:28px;
    font-weight:800;
    letter-spacing:0.5px;
    margin:6px 0 2px;
  }

  .tagline{
    color:#eafffd;
    font-size:13px;
    letter-spacing:0.3px;
    opacity:0.95;
  }

  .doctor{
    padding:22px 24px 6px;
  }

  .doctor-name{
    font-size:19px;
    font-weight:700;
    color:var(--navy-dark);
    margin:0;
  }

  .doctor-role{
    font-size:13px;
    color:var(--text-soft);
    margin-top:4px;
  }

  .links{
    padding:22px 24px 30px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:16px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 14px rgba(0,0,0,0.08);
  }

  .link-btn:active{
    transform:scale(0.98);
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{
    width:20px;
    height:20px;
    fill:#fff;
  }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#1fb69f,#17b3ad); }
  .link-btn.facebook{ background:linear-gradient(135deg,#0e5f8f,#1877c9); }
  .link-btn.instagram{ background:linear-gradient(135deg,#0e5f8f,#17b3ad); }

  .footer-note{
    padding:0 24px 24px;
    font-size:11px;
    color:var(--text-soft);
  }
</style>
</head>
