<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Aqua Medik</title>
<meta name="description" content="Contacto de Aqua Medik, rehabilitación física y neurológica con la Dra. Brenda Vallejo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf7f8;
    --bg-deep:#d8f0f0;
    --surface:#ffffff;
    --navy:#0e5f8f;
    --navy-deep:#0a3f5c;
    --teal:#14b3ab;
    --teal-soft:#bdeeea;
    --text:#0b3a52;
    --text-soft:#5c8398;
    --shadow: 14, 60, 84;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#07222d;
      --bg-deep:#04161e;
      --surface:#0d3446;
      --navy:#5fc2ea;
      --navy-deep:#8fd7f2;
      --teal:#33d9cd;
      --teal-soft:#134a4a;
      --text:#eaf7f8;
      --text-soft:#8fb7c6;
      --shadow: 0, 0, 0;
    }
  }

  :root[data-theme="dark"]{
    --bg:#07222d;
    --bg-deep:#04161e;
    --surface:#0d3446;
    --navy:#5fc2ea;
    --navy-deep:#8fd7f2;
    --teal:#33d9cd;
    --teal-soft:#134a4a;
    --text:#eaf7f8;
    --text-soft:#8fb7c6;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:30px;
    box-shadow:0 24px 50px -12px rgba(var(--shadow),0.28);
    overflow:hidden;
    text-align:center;
  }

  .header{
    position:relative;
    background:linear-gradient(165deg, var(--navy) 0%, var(--teal) 100%);
    padding:40px 24px 46px;
    overflow:hidden;
  }

  .header .swell{
    position:absolute;
    left:0; right:0; bottom:-2px;
    width:100%;
    height:34px;
    display:block;
  }

  .logo-wrap{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 14px;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 24px rgba(6,32,44,0.25);
  }

  .logo-wrap svg{ width:72px; height:72px; }

  .brand{
    position:relative;
    font-family:'Baloo 2', 'Inter', sans-serif;
    color:#ffffff;
    font-size:30px;
    font-weight:800;
    letter-spacing:0.3px;
    margin:4px 0 4px;
  }

  .tagline{
    position:relative;
    color:#eafffb;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.4px;
    text-transform:uppercase;
    opacity:0.92;
  }

  .doctor{ padding:26px 24px 4px; }

  .doctor-name{
    font-family:'Baloo 2', sans-serif;
    font-size:20px;
    font-weight:700;
    color:var(--navy-deep);
    margin:0;
  }

  .doctor-role{
    font-size:13.5px;
    color:var(--text-soft);
    margin-top:6px;
  }

  .links{
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.35);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#1fb69f,#0e9a8f); }
  .link-btn.facebook{ background:linear-gradient(135deg,#1f78c9,#0e5f8f); }
  .link-btn.instagram{ background:linear-gradient(135deg,#0e5f8f,#17b3ad); }

  .footer-note{
    padding:0 24px 22px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
