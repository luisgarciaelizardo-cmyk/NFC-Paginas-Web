<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mora Pan</title>
<meta name="description" content="Contacto de Mora Pan: Instagram, Facebook, WhatsApp y correo para reportes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef5ec;
    --bg-deep:#dcead7;
    --surface:#ffffff;
    --green-deep:#0a4a30;
    --green:#0f7a4d;
    --green-mid:#1c9660;
    --green-light:#5cb98c;
    --gold:#c9962a;
    --gold-deep:#a87a1a;
    --text:#12331f;
    --text-soft:#5c7c68;
    --shadow: 10, 40, 26;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#07160f;
      --bg-deep:#040c08;
      --surface:#0f2419;
      --green-deep:#8fd6b2;
      --green:#5cb98c;
      --green-mid:#3d9a6f;
      --green-light:#2c7350;
      --gold:#e3b654;
      --gold-deep:#c9962a;
      --text:#eaf5ee;
      --text-soft:#9dc2ac;
      --shadow: 0, 0, 0;
    }
  }

  :root[data-theme="dark"]{
    --bg:#07160f;
    --bg-deep:#040c08;
    --surface:#0f2419;
    --green-deep:#8fd6b2;
    --green:#5cb98c;
    --green-mid:#3d9a6f;
    --green-light:#2c7350;
    --gold:#e3b654;
    --gold-deep:#c9962a;
    --text:#eaf5ee;
    --text-soft:#9dc2ac;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:30px;
    box-shadow:0 24px 50px -12px rgba(var(--shadow),0.28);
    overflow:hidden;
    text-align:center;
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--green-deep) 0%, var(--green-light) 100%);
  }

  .header{
    padding:30px 24px 6px;
  }

  .logo-badge{
    display:inline-block;
    background:#ffffff;
    border-radius:22px;
    padding:16px 20px;
    box-shadow:0 10px 24px -6px rgba(var(--shadow),0.22);
  }

  .logo-badge img{
    display:block;
    width:230px;
    max-width:62vw;
    height:auto;
  }

  .business{ padding:20px 24px 4px; }

  .business-name{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:700;
    color:var(--green-deep);
    margin:0;
  }

  .business-role{
    font-size:13.5px;
    color:var(--text-soft);
    margin-top:6px;
  }

  .links{
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.35);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .label-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.25;
  }

  .link-btn .label-sub{
    font-size:11.5px;
    font-weight:500;
    opacity:0.85;
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.24);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#2fbf71,#1a9c58); }
  .link-btn.instagram{ background:linear-gradient(135deg,#0a4a30,#2c7350); }
  .link-btn.facebook{ background:linear-gradient(135deg,#155c3a,#1c9660); }
  .link-btn.email{ background:linear-gradient(135deg,#c9962a,#a87a1a); }

  .footer-note{
    padding:0 24px 22px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
