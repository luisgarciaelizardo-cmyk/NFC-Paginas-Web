<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Montañés Fuentes Abogados</title>
<meta name="description" content="Montañés Fuentes Abogados S.C.: WhatsApp, Instagram y correo de contacto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e3;
    --bg-deep:#ecdfc4;
    --surface:#fffdf9;
    --navy:#1e2433;
    --navy-deep:#12161f;
    --gold:#b8935a;
    --gold-deep:#8f6f3d;
    --text:#20242f;
    --text-soft:#7d7466;
    --line:#e6dcc6;
    --shadow: 30, 24, 10;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11141c;
      --bg-deep:#080a10;
      --surface:#1a1e2a;
      --navy:#e7dfcc;
      --navy-deep:#f6f0e3;
      --gold:#d1ac72;
      --gold-deep:#e8c98d;
      --text:#f0ece1;
      --text-soft:#a79f8f;
      --line:#2b3040;
      --shadow: 0, 0, 0;
    }
  }

  :root[data-theme="dark"]{
    --bg:#11141c;
    --bg-deep:#080a10;
    --surface:#1a1e2a;
    --navy:#e7dfcc;
    --navy-deep:#f6f0e3;
    --gold:#d1ac72;
    --gold-deep:#e8c98d;
    --text:#f0ece1;
    --text-soft:#a79f8f;
    --line:#2b3040;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:28px;
    box-shadow:0 24px 50px -14px rgba(var(--shadow),0.35);
    overflow:hidden;
    text-align:center;
    border:1px solid var(--line);
  }

  .accent-bar{
    height:7px;
    background:linear-gradient(90deg, var(--navy) 0%, var(--gold) 100%);
  }

  .header{
    padding:34px 24px 8px;
  }

  .logo-badge img{
    display:block;
    width:150px;
    height:150px;
    margin:0 auto;
    border-radius:50%;
    box-shadow:0 10px 24px -8px rgba(var(--shadow),0.4);
  }

  .firm-name{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:23px;
    line-height:1.25;
    color:var(--navy);
    margin:18px 0 0;
  }

  .firm-suffix{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-top:6px;
  }

  .divider{
    width:56px;
    height:2px;
    background:var(--gold);
    margin:16px auto 0;
    border-radius:2px;
  }

  .tagline{
    font-size:13px;
    color:var(--text-soft);
    margin-top:14px;
    letter-spacing:0.2px;
  }

  .links{
    padding:24px 24px 30px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:16px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -8px rgba(var(--shadow),0.45);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#2fac66,#1c7a48); }
  .link-btn.instagram{ background:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7); }
  .link-btn.email{ background:linear-gradient(135deg,#1e2433,#12161f); }

  .footer-note{
    padding:0 24px 24px;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--text-soft);
  }
</style>
</head>
