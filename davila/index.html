<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Clínica Veterinaria Jorge Dávila</title>
<meta name="description" content="Contacto de la Clínica Veterinaria Dr. Jorge Dávila: WhatsApp, llamadas, ubicación, Instagram, Facebook y reseñas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414;
    --bg-deep:#0a0a0a;
    --surface:#1c1c1c;
    --teal:#2fe0bd;
    --teal-deep:#149a80;
    --blue:#6ec3ee;
    --blue-deep:#2f7fb0;
    --gold:#e0a020;
    --gold-deep:#a8720f;
    --text:#f2f2f2;
    --text-soft:#a8a49e;
    --line:#2e2e2e;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg), var(--bg-deep) 65%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:30px;
    box-shadow:0 24px 50px -12px rgba(var(--shadow),0.5);
    overflow:hidden;
    text-align:center;
    border:1px solid var(--line);
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--teal) 0%, var(--blue) 100%);
  }

  .header{
    padding:30px 24px 6px;
  }

  .logo-badge img{
    display:block;
    width:200px;
    max-width:58vw;
    height:auto;
    margin:0 auto;
  }

  .header-role{
    font-family:'Caveat', cursive;
    font-size:22px;
    font-weight:600;
    color:var(--blue);
    margin:8px 0 0;
  }

  .links{
    padding:20px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.5);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .label-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.25;
  }

  .link-btn .label-sub{
    font-size:11.5px;
    font-weight:500;
    opacity:0.85;
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#2fbf71,#1a9c58); }
  .link-btn.call{ background:linear-gradient(135deg,var(--teal),var(--teal-deep)); }
  .link-btn.location{ background:linear-gradient(135deg,var(--blue),var(--blue-deep)); }
  .link-btn.instagram{ background:linear-gradient(135deg,#1c2b3a,var(--blue-deep)); }
  .link-btn.facebook{ background:linear-gradient(135deg,#1f78c9,#12466e); }
  .link-btn.reviews{ background:linear-gradient(135deg,var(--gold),var(--gold-deep)); }

  .footer-note{
    padding:0 24px 22px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
