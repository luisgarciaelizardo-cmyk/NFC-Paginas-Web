<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Vicasa</title>
<meta name="description" content="Contacto de Ferretería Vicasa en Saltillo: WhatsApp de facturación, Instagram y ubicación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f9;
    --bg-deep:#dde6f5;
    --surface:#ffffff;
    --navy-deep:#1f2c56;
    --navy:#2f5aa0;
    --blue:#6c84c0;
    --blue-light:#9fb6de;
    --text:#1c2440;
    --text-soft:#5b6b8c;
    --shadow: 20, 32, 64;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0f1f;
      --bg-deep:#05070f;
      --surface:#121b33;
      --navy-deep:#a9c0ea;
      --navy:#7fa0d8;
      --blue:#5b84c4;
      --blue-light:#3d5680;
      --text:#eef2f9;
      --text-soft:#a4b4d4;
      --shadow: 0, 0, 0;
    }
  }

  :root[data-theme="dark"]{
    --bg:#0a0f1f;
    --bg-deep:#05070f;
    --surface:#121b33;
    --navy-deep:#a9c0ea;
    --navy:#7fa0d8;
    --blue:#5b84c4;
    --blue-light:#3d5680;
    --text:#eef2f9;
    --text-soft:#a4b4d4;
    --shadow: 0, 0, 0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-deep), var(--bg) 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:30px;
    box-shadow:0 24px 50px -12px rgba(var(--shadow),0.28);
    overflow:hidden;
    text-align:center;
  }

  .accent-bar{
    height:8px;
    background:linear-gradient(90deg, var(--navy-deep) 0%, var(--blue) 100%);
  }

  .header{
    padding:32px 24px 8px;
  }

  .logo-badge{
    display:inline-block;
    background:#ffffff;
    border-radius:22px;
    padding:18px 22px;
    box-shadow:0 10px 24px -6px rgba(var(--shadow),0.22);
  }

  .logo-badge img{
    display:block;
    height:210px;
    width:auto;
    max-width:56vw;
  }

  .business{ padding:20px 24px 4px; }

  .business-name{
    font-family:'Archivo', sans-serif;
    font-size:19px;
    font-weight:800;
    letter-spacing:0.2px;
    color:var(--navy-deep);
    margin:0;
  }

  .business-role{
    font-size:13.5px;
    color:var(--text-soft);
    margin-top:6px;
  }

  .links{
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    color:#fff;
    transition:transform .15s ease;
    box-shadow:0 8px 18px -6px rgba(var(--shadow),0.35);
  }

  .link-btn:active{ transform:scale(0.97); }

  .link-btn .label-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.25;
  }

  .link-btn .label-sub{
    font-size:11.5px;
    font-weight:500;
    opacity:0.85;
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-btn.whatsapp{ background:linear-gradient(135deg,#2fbf71,#1a9c58); }
  .link-btn.instagram{ background:linear-gradient(135deg,var(--navy-deep),var(--blue)); }
  .link-btn.location{ background:linear-gradient(135deg,var(--navy),var(--blue-light)); }

  .footer-note{
    padding:0 24px 22px;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--text-soft);
  }
</style>
</head>
<body>

  </div>

  <div class="footer-note">Ferretería Vicasa &middot; Saltillo, Coahuila</div>

</div>

</body>
</html>
